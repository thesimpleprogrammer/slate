name: Deploy (Staging & Production) to EC2 via OIDC

on:
  push:
    branches: [ "staging" ]
    paths:
      - 'backend/**'
      - '.github/**'
  release:
    types: [ published ]
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC
  contents: read

env:
  IMAGE: blacc/slate         # <-- change if your Docker Hub repo is different
  EC2_NAME_TAG: slate         # <-- EC2 "Name" tag used to find the instance

jobs:
  test:
    runs-on: ubuntu-latest
    name: Setup, test, and build project
    steps:
      - name: Checkout
        uses: actions/checkout@v3 

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Test application
        working-directory: ./backend
        run: npm test

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  # or ACCESS_TOKEN if that's what you use

      - name: Build & Push (staging on push, prod on release)
        working-directory: ./backend
        run: |
          set -e
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # === STAGING ===
            TAG=staging
            # Immutable tag (staging-${sha})
            docker build -t $IMAGE:$TAG-${{ github.sha }} .
            docker push $IMAGE:$TAG-${{ github.sha }}
            # Moving tag (staging -> latest build)
            docker tag $IMAGE:$TAG-${{ github.sha }} $IMAGE:$TAG
            docker push $IMAGE:$TAG
          else
            # === PRODUCTION (release) ===
            RELTAG="${{ github.event.release.tag_name }}"
            # Immutable tag (release-${sha})
            docker build -t $IMAGE:$RELTAG-${{ github.sha }} .
            docker push $IMAGE:$RELTAG-${{ github.sha }}
            # Clean release tag (v1.2.3)
            docker tag $IMAGE:$RELTAG-${{ github.sha }} $IMAGE:$RELTAG
            docker push $IMAGE:$RELTAG
            # Update :latest
            docker tag $IMAGE:$RELTAG-${{ github.sha }} $IMAGE:latest
            docker push $IMAGE:latest
          fi


  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # IMPORTANT: this must be a ROLE ARN, not the OIDC provider ARN
          role-to-assume: arn:aws:iam::338052313607:role/EC2-Slate-Admin  # <-- replace
          aws-region: eu-north-1  # <-- your region

      - name: Resolve EC2 instance by Name tag
        id: ec2
        run: |
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${EC2_NAME_TAG}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [[ -z "$IID" || "$IID" == "None" ]]; then
            echo "No running instance found with Name tag '${EC2_NAME_TAG}'"
            exit 1
          fi
          echo "instance_id=$IID" >> $GITHUB_OUTPUT

      - name: Set deploy vars (container name/port/tag)
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "TAG=staging" >> $GITHUB_OUTPUT
            echo "NAME=slate-staging" >> $GITHUB_OUTPUT
            echo "PORT=8080" >> $GITHUB_OUTPUT
          else
            echo "TAG=latest" >> $GITHUB_OUTPUT       # runs prod with :latest
            echo "NAME=slate-prod" >> $GITHUB_OUTPUT
            echo "PORT=80" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSM (pull, stop, replace, run)
        id: deploy
        run: |
          IMAGE="${IMAGE}"
          TAG="${{ steps.vars.outputs.TAG }}"
          NAME="${{ steps.vars.outputs.NAME }}"
          PORT="${{ steps.vars.outputs.PORT }}"
          IID="${{ steps.ec2.outputs.instance_id }}"

           # Run SSM command and capture CommandId
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$IID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $NAME ($IMAGE:$TAG)" \
            --query "Command.CommandId" \
            --output text \
            --parameters "commands=[
              \"docker pull ${IMAGE}:${TAG}\",
              \"docker stop ${NAME} || true\",
              \"docker rm ${NAME} || true\",
              \"docker run -d --restart unless-stopped --env-file /etc/slate/backend.env -p ${PORT}:5000 --name ${NAME} ${IMAGE}:${TAG}\"
            ]")

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Fetch deployment logs (optional)
        run: |
          aws ssm list-command-invocations \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --details
